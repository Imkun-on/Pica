<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Pica</title>
  <!-- WebView2 non mostra nessuna scheda, quindi questo titolo dentro la
       finestra non si vede: serve a chi apre il file in un browser per
       lavorarci sopra. -->
  <link rel="icon" href="../assets/Pica.png">
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>

  <!-- Le icone stanno qui una volta sola e si richiamano con <use>. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="i-audio" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>
      </g>
      <g id="i-disco" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/>
      </g>
      <g id="i-video" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/>
        <path d="M2.5 9.5h19M7 5v4.5M17 5v4.5M7 19v-4.5M17 19v-4.5M2.5 14.5h19"/>
      </g>
      <g id="i-forbici" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/>
        <path d="M20 4L8.5 15.5M14.5 14.5L20 20M8.5 8.5l3 3"/>
      </g>
      <g id="i-sottotitoli" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M6.5 12.5h4M13 12.5h4.5M6.5 15.5h7M15.5 15.5h2"/>
      </g>
      <g id="i-voce" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M8.5 21h7"/>
      </g>
      <g id="i-cerca" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
      </g>
      <g id="i-scarica" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12M7.5 10.5L12 15l4.5-4.5M4 19h16"/>
      </g>
      <g id="i-collega" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 14a4.5 4.5 0 006.4 0l3-3a4.5 4.5 0 00-6.4-6.4l-1 1"/>
        <path d="M14 10a4.5 4.5 0 00-6.4 0l-3 3a4.5 4.5 0 006.4 6.4l1-1"/>
      </g>
      <g id="i-cartella" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 012-2h4l2 2.5h8a2 2 0 012 2V17a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      </g>
      <g id="i-vuoto" fill="none" stroke="currentColor" stroke-width="1.3"
         stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M8.5 14.5h7"/>
      </g>
      <g id="i-lente" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M11 8.5v5M8.5 11h5"/>
      </g>
      <g id="i-avvia" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 4.5l12 7.5-12 7.5z"/>
      </g>
      <g id="i-filtro" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M4 7h16M7 12h10M10 17h4"/>
      </g>
      <g id="i-puntini" fill="currentColor" stroke="none">
        <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
      </g>
      <g id="i-volume" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"/><path d="M15.5 9a4.5 4.5 0 010 6M18 6.5a8 8 0 010 11"/>
      </g>
      <g id="i-precedente" fill="currentColor" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6v12l-9-6z"/><path d="M6 6v12" fill="none"/>
      </g>
      <g id="i-successivo" fill="currentColor" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6v12l9-6z"/><path d="M18 6v12" fill="none"/>
      </g>
      <g id="i-onde" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M4 10v4M8 6v12M12 9v6M16 4v16M20 10v4"/>
      </g>
      <g id="i-freccia-giu" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v13M6.5 11.5L12 17l5.5-5.5M5 20h14"/>
      </g>
      <g id="i-disco-fisso" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 13l2.8-7.2A2 2 0 017.7 4.5h8.6a2 2 0 011.9 1.3L21 13v4.5a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <path d="M3 13h18M7 16.5h.01M10.5 16.5h.01"/>
      </g>
      <g id="i-opzioni" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>
      </g>
      <g id="i-maniglia" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M8 7h8M8 12h8M8 17h8"/>
      </g>
      <!-- Le tre che servono alla finestra: un guaio, un errore, una conferma. -->
      <g id="i-avviso" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.5L21.5 20h-19z"/><path d="M12 9.5v5M12 17.2v.3"/>
      </g>
      <g id="i-errore" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.2v.3"/>
      </g>
      <g id="i-spunta" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 12.5l5 5 10-11"/>
      </g>
    </defs>
  </svg>

  <!-- L'impianto e' quello di un programma da lavoro: la testata in alto, a
       sinistra la colonna stretta degli strumenti, in mezzo lo spazio di
       lavoro, a destra le opzioni di quello che si sta facendo, in fondo la
       barra di stato. -->
  <div class="guscio">

    <header class="testata">
      <!-- Il marchio: la gazza ladra col CD nel becco, scontornata. E' lo
           stesso segno dell'icona sul desktop, cosi' chi ha appena fatto
           doppio clic lo ritrova dentro la finestra. marchio.png e le icone
           dell'eseguibile escono tutti da assets/marchio.py. -->
      <div class="marca">
        <img src="marchio.png" alt="" draggable="false">
        <span>Pica<span class="marca-punto">.</span></span>
      </div>
      <div class="briciole">
        <span data-t="testata.spazio"></span><span class="briciole-taglio">/</span>
        <strong id="briciola"></strong>
      </div>
      <!-- Un lavoro alla volta puo' essere partito in una stanza in cui adesso
           non si sta: questa dice dove, e cliccandola ci si torna. -->
      <button class="pillola-lavori" id="pillola-lavori" hidden>
        <span class="punto-vivo"></span><span id="pillola-testo"></span>
      </button>
    </header>

    <div class="impianto">

      <!-- Sette strumenti, e in ciascuno c'e' tutto il lavoro di quel
           mestiere. Il nome compare passandoci sopra; il puntino sull'icona
           dice se li' dentro sta girando qualcosa. -->
      <nav class="barra">
        <div class="menu">
          <button class="voce attiva" data-va="audio">
            <svg class="icona" viewBox="0 0 24 24"><use href="#i-audio"/></svg>
            <span class="voce-nome" data-t="menu.audio"></span>
            <span class="targhetta-menu spenta" data-targhetta="audio"></span>
          </button>
          <button class="voce" data-va="burn">
            <svg class="icona" viewBox="0 0 24 24"><use href="#i-disco"/></svg>
            <span class="voce-nome" data-t="menu.burn"></span>
            <span class="targhetta-menu spenta" data-targhetta="burn"></span>
          </button>
          <button class="voce" data-va="video">
            <svg class="icona" viewBox="0 0 24 24"><use href="#i-video"/></svg>
            <span class="voce-nome" data-t="menu.video"></span>
            <span class="targhetta-menu spenta" data-targhetta="video"></span>
          </button>
          <button class="voce" data-va="pix">
            <svg class="icona" viewBox="0 0 24 24"><use href="#i-lente"/></svg>
            <span class="voce-nome" data-t="menu.pix"></span>
            <span class="targhetta-menu spenta" data-targhetta="pix"></span>
          </button>
          <button class="voce" data-va="sub">
            <svg class="icona" viewBox="0 0 24 24"><use href="#i-sottotitoli"/></svg>
            <span class="voce-nome" data-t="menu.sub"></span>
            <span class="targhetta-menu spenta" data-targhetta="sub"></span>
          </button>
          <button class="voce" data-va="dop">
            <svg class="icona" viewBox="0 0 24 24"><use href="#i-voce"/></svg>
            <span class="voce-nome" data-t="menu.dop"></span>
            <span class="targhetta-menu spenta" data-targhetta="dop"></span>
          </button>
          <button class="voce" data-va="clip">
            <svg class="icona" viewBox="0 0 24 24"><use href="#i-forbici"/></svg>
            <span class="voce-nome" data-t="menu.clip"></span>
            <span class="targhetta-menu spenta" data-targhetta="clip"></span>
          </button>
        </div>
      </nav>

      <main class="corpo">

        <!-- ══ AUDIO ════════════════════════════════════════════════════ -->
        <!-- Un link e Analizza: quello che c'e' dietro finisce in coda nella
             libreria. Le opzioni a destra dicono come scaricarlo, il bottone
             in fondo lo scarica. Quello che e' arrivato si ascolta dal lettore
             in basso. Il lavoro sta in features/libreria.js. -->
        <div class="sezione attiva con-suonatore" data-sez="audio">
          <div class="lavoro">
            <header class="intestazione">
              <div class="simbolo"><svg class="icona" viewBox="0 0 24 24"><use href="#i-audio"/></svg></div>
              <div>
                <div class="occhiello" data-t="studio.occhiello"></div>
                <h1 data-t="menu.audio"></h1>
              </div>
            </header>
            <p class="intro" data-t="audio.intro"></p>

            <section class="importa">
              <div class="importa-capo">
                <svg class="icona" viewBox="0 0 24 24"><use href="#i-collega"/></svg>
                <h2 data-t="audio.importa"></h2>
                <span class="sigla">URL</span>
              </div>
              <div class="modulo-link">
                <div class="campo-icona">
                  <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-collega"/></svg>
                  <input id="a-link" class="campo con-icona" type="text" spellcheck="false"
                         placeholder="https://www.youtube.com/watch?v=…">
                </div>
                <button id="a-scarica" class="bottone pieno">
                  <svg class="icona" viewBox="0 0 24 24"><use href="#i-cerca"/></svg>
                  <span data-t="scarica.analizza"></span>
                </button>
              </div>
              <div class="importa-nota" data-t="audio.importa.nota"></div>
            </section>

            <!-- L'avanzamento e' di questa sezione e resta qui: ogni stanza ha
                 la sua barra. -->
            <div class="avanzamento">
              <div class="binario"><div class="cursa"></div></div>
              <div class="avanzamento-testo"></div>
            </div>

            <section class="libreria">
              <div class="libreria-capo">
                <div>
                  <h2><span data-t="lib.titolo"></span><span class="conta" id="a-conta">0</span></h2>
                  <p data-t="lib.sotto"></p>
                </div>
                <button id="a-apri-cartella" class="bottone-nota">
                  <svg class="icona" viewBox="0 0 24 24"><use href="#i-cartella"/></svg>
                  <span data-t="lib.apri"></span>
                </button>
              </div>
              <div class="libreria-barra">
                <div class="linguette" id="a-linguette">
                  <button class="attiva" data-l="tutti"><span data-t="lib.tutti"></span></button>
                  <button data-l="fatti"><span data-t="lib.fatti"></span></button>
                  <button data-l="coda"><span data-t="lib.coda"></span><span class="conta" id="a-conta-coda" hidden></span></button>
                  <button data-l="archivio"><span data-t="lib.archivio"></span></button>
                </div>
                <div class="libreria-cerca">
                  <svg class="icona" viewBox="0 0 24 24"><use href="#i-cerca"/></svg>
                  <input id="a-cerca" type="text" spellcheck="false">
                  <button id="a-filtro" class="bottone-icona">
                    <svg class="icona" viewBox="0 0 24 24"><use href="#i-filtro"/></svg>
                  </button>
                </div>
              </div>
              <div class="tabella">
                <div class="tabella-capo">
                  <span class="col-spunta"><input type="checkbox" id="a-tutti"></span>
                  <span data-t="lib.col.traccia"></span>
                  <span data-t="lib.col.durata"></span>
                  <span data-t="lib.col.formato"></span>
                  <span data-t="lib.col.stato"></span>
                  <span></span>
                </div>
                <div id="a-risultati" class="tabella-righe"></div>
              </div>
              <div class="libreria-piede">
                <span id="a-totali"></span>
                <span id="a-spazio"></span>
              </div>
            </section>
          </div>

          <aside class="ispettore">
            <div class="ispettore-testa">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-opzioni"/></svg>
              <h2 data-t="opz.audio"></h2>
            </div>
            <div class="ispettore-corpo">
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="opz.uscita"></h3>
                <div class="gruppo">
                  <label data-t="opz.formato"></label>
                  <select id="a-formato" class="campo">
                    <option value="m4a">M4A · AAC</option>
                    <option value="mp3">MP3</option>
                    <option value="flac">FLAC</option>
                    <option value="wav">WAV</option>
                    <option value="opus">OPUS</option>
                  </select>
                </div>
                <div class="gruppo">
                  <label data-t="opz.qualita"></label>
                  <select id="a-qualita" class="campo">
                    <option value="0" data-t="opz.qualita.migliore"></option>
                    <option value="320" data-t="opz.qualita.alta"></option>
                    <option value="256">256 kbps</option>
                    <option value="192">192 kbps</option>
                    <option value="128">128 kbps</option>
                  </select>
                </div>
                <div class="gruppo">
                  <label data-t="opz.frequenza"></label>
                  <select id="a-frequenza" class="campo">
                    <option value="0" data-t="opz.frequenza.originale"></option>
                    <option value="44100">44.100 Hz</option>
                    <option value="48000">48.000 Hz</option>
                    <option value="96000">96.000 Hz</option>
                  </select>
                </div>
                <div class="interruttori">
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="a-mono"><span class="cursore"></span>
                    <span data-t="opz.mono"></span>
                  </label>
                </div>
                <div class="nota-riga" data-t="opz.nota.sorgente"></div>
              </section>
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="opz.metadati"></h3>
                <div class="interruttori">
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="a-metadati" checked><span class="cursore"></span>
                    <span data-t="opz.metadati.si"></span>
                  </label>
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="a-copertina" checked><span class="cursore"></span>
                    <span data-t="opz.copertina"></span>
                  </label>
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="a-normalizza"><span class="cursore"></span>
                    <span data-t="opz.normalizza"></span>
                  </label>
                </div>
              </section>
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="opz.destinazione"></h3>
                <div class="gruppo">
                  <label data-t="opz.salva"></label>
                  <button id="a-cartella" class="campo scegli-cartella" type="button">
                    <svg class="icona" viewBox="0 0 24 24"><use href="#i-cartella"/></svg>
                    <span id="a-cartella-nome"></span>
                    <svg class="icona" viewBox="0 0 24 24"><use href="#i-puntini"/></svg>
                  </button>
                </div>
                <div class="interruttori">
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="a-cartella-playlist" checked><span class="cursore"></span>
                    <span data-t="opz.cartella_playlist"></span>
                  </label>
                </div>
              </section>
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="opz.scelto"></h3>
                <div id="a-scelto"></div>
              </section>
            </div>
            <div class="ispettore-piede">
              <button id="a-avvia" class="bottone pieno" disabled>
                <svg class="icona" viewBox="0 0 24 24"><use href="#i-scarica"/></svg>
                <span data-t="opz.scarica"></span>
                <span class="bottone-conta" id="a-avvia-n" hidden></span>
              </button>
              <p class="piede-nota" data-t="opz.scarica.nota"></p>
            </div>
          </aside>

          <!-- Il lettore: un brano alla volta, quello scelto nella libreria. -->
          <div class="suonatore" id="a-suonatore">
            <div class="suonatore-brano">
              <div class="copertina" id="a-s-copertina"></div>
              <div class="suonatore-nomi">
                <strong id="a-s-titolo"></strong>
                <span id="a-s-artista"></span>
              </div>
            </div>
            <div class="suonatore-centro">
              <div class="suonatore-tasti">
                <button id="a-s-prima" class="bottone-icona">
                  <svg class="icona" viewBox="0 0 24 24"><use href="#i-precedente"/></svg>
                </button>
                <button id="a-s-play" class="tasto-play"></button>
                <button id="a-s-dopo" class="bottone-icona">
                  <svg class="icona" viewBox="0 0 24 24"><use href="#i-successivo"/></svg>
                </button>
              </div>
              <div class="suonatore-tempo">
                <span id="a-s-ora">0:00</span>
                <input type="range" id="a-s-cerca" class="p-cerca" min="0" max="0" step="0.1" value="0">
                <span id="a-s-fine">–:––</span>
              </div>
            </div>
            <div class="suonatore-volume">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-volume"/></svg>
              <input type="range" id="a-s-volume" class="p-cerca" min="0" max="100" value="70">
              <span class="divisore-v"></span>
              <span id="a-s-formato"></span>
            </div>
          </div>
        </div>

        <!-- ══ VIDEO ════════════════════════════════════════════════════ -->
        <!-- Come Audio, ma per i video: a sinistra quello che e' stato
             chiesto, a destra quello che e' pronto. -->
        <div class="sezione" data-sez="video">
          <div class="lavoro">
            <header class="intestazione">
              <div class="simbolo"><svg class="icona" viewBox="0 0 24 24"><use href="#i-video"/></svg></div>
              <div>
                <div class="occhiello" data-t="studio.occhiello"></div>
                <h1 data-t="menu.video"></h1>
              </div>
            </header>
            <p class="intro" data-t="video.desc"></p>

            <section class="importa">
              <label class="etichetta" data-t="video.link"></label>
              <div class="modulo-link">
                <div class="campo-icona">
                  <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-collega"/></svg>
                  <input id="v-link" class="campo con-icona" type="text" spellcheck="false"
                         placeholder="https://www.youtube.com/watch?v=…">
                </div>
                <button id="v-scarica" class="bottone pieno">
                  <svg class="icona" viewBox="0 0 24 24"><use href="#i-cerca"/></svg>
                  <span data-t="scarica.analizza"></span>
                </button>
              </div>
            </section>

            <div class="avanzamento">
              <div class="binario"><div class="cursa"></div></div>
              <div class="avanzamento-testo"></div>
            </div>

            <div class="v-doppia">
              <section class="pannello">
                <div class="titolo-pannello">
                  <span class="spia"></span>
                  <span data-t="video.coda"></span>
                  <span class="stato"></span>
                </div>
                <div id="v-risultati" class="elenco"></div>
              </section>
              <section class="pannello">
                <div class="titolo-pannello">
                  <span data-t="video.pronti"></span>
                  <span id="v-conta" class="targhetta" hidden></span>
                </div>
                <div id="v-pronti" class="elenco"></div>
              </section>
            </div>
          </div>

          <aside class="ispettore">
            <div class="ispettore-testa">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-opzioni"/></svg>

            </div>
            <div class="ispettore-corpo">
              <section class="blocco">
                <div class="gruppo">
                  <label data-t="audio.subs"></label>
                  <select id="v-sottotitoli" class="campo">
                    <option value="" data-t="audio.subs.no"></option>
                    <option value="traccia" data-t="audio.subs.traccia"></option>
                    <option value="impressi" data-t="audio.subs.impressi"></option>

                <div class="gruppo" id="v-gruppo-traduci" hidden>

        <!-- ══ MASTERIZZAZIONE ══════════════════════════════════════════ -->
        <div class="sezione" data-sez="burn">
          <div class="lavoro">
            <header class="intestazione">
              <div class="simbolo"><svg class="icona" viewBox="0 0 24 24"><use href="#i-disco"/></svg></div>
              <div>
                <div class="occhiello" data-t="studio.occhiello"></div>
                <h1 data-t="menu.burn"></h1>
              </div>
            </header>
            <p class="intro" data-t="burn.desc"></p>

            <section class="importa">
              <label class="etichetta" data-t="burn.folder"></label>

                <input id="b-cartella" class="campo con-icona scelto" type="text" readonly>

            </section>

            <div class="avanzamento">

            </div>

            <section class="pannello">

            <div class="ispettore-corpo">
              <section class="blocco">
                <div class="capienza-riga">
                  <span class="targhetta" id="b-capienza"></span>
                </div>
                <div class="capienza"><div class="capienza-piena" id="b-barra-cd"></div></div>
                <div class="nota-riga" id="b-criterio"></div>
                <div class="nota-riga" id="b-silenzi"></div>
              </section>
            </div>
            <div class="ispettore-piede">
              <button id="b-avvia" class="bottone pieno" disabled>

          </aside>
        </div>

        <!-- ══ MIGLIORA QUALITA' ════════════════════════════════════════ -->
        <div class="sezione" data-sez="pix">
          <div class="lavoro">
            <header class="intestazione">
              <div class="simbolo"><svg class="icona" viewBox="0 0 24 24"><use href="#i-lente"/></svg></div>
              <div>
                <div class="occhiello" data-t="studio.occhiello"></div>
                <h1 data-t="menu.pix"></h1>
              </div>
            </header>
            <p class="intro" data-t="pix.desc"></p>

            <!-- Il video si prende dal disco oppure da YouTube: incollato il
                 link, si scarica in risultati/Video e si analizza da solo. -->
            <section class="importa doppia">
              <div class="gruppo">
                <label class="etichetta" data-t="pix.file"></label>
                <div class="campo-icona">
                  <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-video"/></svg>
                  <input id="p-file" class="campo con-icona scelto" type="text" readonly>
                </div>
              </div>
              <div class="gruppo">
                <label class="etichetta" data-t="pix.link"></label>
                <div class="modulo-link">
                  <div class="campo-icona">
                    <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-collega"/></svg>
                    <input id="p-link" class="campo con-icona" type="text" spellcheck="false"
                           placeholder="https://www.youtube.com/watch?v=…">
                  </div>
                  <button id="p-scarica" class="bottone contorno">
                    <svg class="icona" viewBox="0 0 24 24"><use href="#i-scarica"/></svg>
                    <span data-t="pix.link.scarica"></span>
                  </button>
                </div>
              </div>
            </section>

            <div class="avanzamento">
              <div class="binario"><div class="cursa"></div></div>
              <div class="avanzamento-testo"></div>
            </div>

            <!-- Lo schermo: il video scelto, e a lavoro finito il confronto,
                 con la linea da trascinare fra prima e dopo. -->
            <section class="pannello">
              <div class="titolo-pannello">
                <span class="spia"></span>
                <span data-t="pix.preview"></span>
                <span class="stato"></span>
              </div>
              <div id="p-anteprima" class="anteprima"></div>
            </section>
          </div>

          <aside class="ispettore">
            <div class="ispettore-testa">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-opzioni"/></svg>
              <h2 data-t="ispettore.opzioni"></h2>
            </div>
            <div class="ispettore-corpo">
              <!-- La risoluzione porta con se' il giudizio misurato su quel
                   file: la riga sotto dice quanto si ingrandisce e se regge. -->
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="pix.blocco.risoluzione"></h3>
                <div class="gruppo">
                  <label data-t="pix.resolution"></label>
                  <select id="p-risoluzione" class="campo"></select>
                </div>
                <div class="nota-riga" id="p-nota-risoluzione"></div>
                <div class="nota-riga" id="p-sorgente"></div>
              </section>
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="pix.preset"></h3>
                <!-- Il valore scelto sta qui; i bottoni sotto lo scrivono. -->
                <input type="hidden" id="p-preset">
                <div id="p-trattamenti" class="trattamenti"></div>
                <div class="nota-riga" id="p-nota-preset"></div>
                <div class="interruttori" id="p-ritocchi">
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="p-rumore"><span class="cursore"></span>
                    <span data-t="pix.rumore"></span>
                  </label>
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="p-stabilizza"><span class="cursore"></span>
                    <span data-t="pix.stabilizza"></span>
                  </label>
                </div>
                <label class="scorri-campo">
                  <span data-t="pix.dettaglio"></span>
                  <input type="range" id="p-dettaglio" class="p-cerca" min="0" max="100" value="50">
                </label>
              </section>
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="pix.diagnosis"></h3>
                <div id="p-diagnosi" class="diagnosi"></div>
              </section>
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="pix.blocco.uscita"></h3>
                <div class="interruttori">
                  <label class="interruttore">
                    <input type="checkbox" id="p-confronto" checked><span class="cursore"></span>
                    <span data-t="pix.compare"></span>
                  </label>
                  <label class="interruttore">
                    <input type="checkbox" id="p-gpu"><span class="cursore"></span>
                    <span data-t="pix.gpu"></span>
                  </label>
                </div>
              </section>
            </div>
            <div class="ispettore-piede">
              <button id="p-analizza" class="bottone contorno">
                <svg class="icona" viewBox="0 0 24 24"><use href="#i-lente"/></svg>
                <span data-t="pix.analyze"></span>
              </button>
              <button id="p-avvia" class="bottone pieno" disabled>
                <svg class="icona" viewBox="0 0 24 24"><use href="#i-avvia"/></svg>
                <span data-t="pix.start"></span>
              </button>
            </div>
          </aside>
        </div>

        <!-- ══ MONTAGGIO ════════════════════════════════════════════════ -->
        <!-- Quattro operazioni, una linguetta ciascuna. Taglia, GIF e WebP
             lavorano sulla timeline: si vede il video, si trascinano le due
             maniglie e quello che sta in mezzo e' lo spezzone. Unisci mostra
             l'elenco dei file. A destra le opzioni di quello che esce. -->
        <div class="sezione" data-sez="clip">
          <div class="lavoro">
            <header class="intestazione">
              <div class="simbolo"><svg class="icona" viewBox="0 0 24 24"><use href="#i-forbici"/></svg></div>
              <div>
                <div class="occhiello" data-t="studio.occhiello"></div>
                <h1 data-t="menu.clip"></h1>
              </div>
              <span class="intestazione-coda" id="c-nome-file"></span>
            </header>

            <div class="linguette">
              <button class="voce sotto" data-va="clip" data-op="taglia"><span data-t="menu.clip.taglia"></span></button>
              <button class="voce sotto" data-va="clip" data-op="gif"><span data-t="menu.clip.gif"></span></button>
              <button class="voce sotto" data-va="clip" data-op="webp"><span data-t="menu.clip.webp"></span></button>
              <button class="voce sotto" data-va="clip" data-op="unisci"><span data-t="menu.clip.unisci"></span></button>
            </div>
            <p class="intro" id="c-desc"></p>

            <section class="importa">
              <label class="etichetta" id="c-etichetta-file"></label>
              <div class="campo-icona">
                <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-video"/></svg>
                <input id="c-file" class="campo con-icona scelto" type="text" readonly>
              </div>
            </section>

            <div class="avanzamento">
              <div class="binario"><div class="cursa"></div></div>
              <div class="avanzamento-testo"></div>
            </div>

            <!-- Il banco: lo schermo, e sotto la timeline. Lo riempie
                 features/clip.js. -->
            <section class="banco" id="c-banco"></section>
          </div>

          <aside class="ispettore">
            <div class="ispettore-testa">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-opzioni"/></svg>
              <h2 data-t="clip.uscita"></h2>
            </div>
            <div class="ispettore-corpo">
              <!-- Di ogni campo si dice a quale operazione serve: gli altri
                   restano nascosti. -->
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="clip.blocco.formato"></h3>
                <div class="gruppo" data-per="taglia">
                  <label data-t="clip.contenitore"></label>
                  <select id="c-contenitore" class="campo">
                    <option value="" data-t="clip.contenitore.originale"></option>
                    <option value="mp4">MP4</option>
                    <option value="mov">MOV</option>
                    <option value="webm">WebM</option>
                    <option value="mkv">MKV</option>
                  </select>
                </div>
                <div class="gruppo" data-per="taglia">
                  <label data-t="clip.codec"></label>
                  <select id="c-codec" class="campo">
                    <option value="" data-t="clip.codec.copia"></option>
                    <option value="h264">H.264</option>
                    <option value="h265">H.265</option>
                    <option value="av1">AV1</option>
                  </select>
                </div>
                <div class="gruppo" data-per="taglia">
                  <label data-t="clip.risoluzione"></label>
                  <select id="c-risoluzione" class="campo">
                    <option value="" data-t="clip.risoluzione.originale"></option>
                    <option value="2160">3840 × 2160 · 4K UHD</option>
                    <option value="1440">2560 × 1440 · QHD</option>
                    <option value="1080">1920 × 1080 · Full HD</option>
                    <option value="720">1280 × 720 · HD</option>
                    <option value="480">854 × 480 · SD</option>
                  </select>
                </div>
                <div class="nota-riga" id="c-nota-codec" data-per="taglia"></div>
                <div class="gruppo" data-per="gif webp">
                  <label data-t="clip.fps"></label>
                  <input id="c-fps" class="campo" type="text" placeholder="15">
                </div>
                <div class="gruppo" data-per="gif webp">
                  <label data-t="clip.larghezza"></label>
                  <input id="c-larghezza" class="campo" type="text" placeholder="480">
                </div>
                <div class="interruttori">
                  <label class="interruttore rovescio" data-per="taglia">
                    <input type="checkbox" id="c-audio" checked><span class="cursore"></span>
                    <span data-t="clip.audio"></span>
                  </label>
                  <label class="interruttore rovescio" data-per="taglia">
                    <input type="checkbox" id="c-preciso"><span class="cursore"></span>
                    <span data-t="clip.preciso"></span>
                  </label>
                  <label class="interruttore rovescio" data-per="unisci">
                    <input type="checkbox" id="c-capitoli" checked><span class="cursore"></span>
                    <span data-t="clip.capitoli"></span>
                  </label>
                </div>
              </section>
              <section class="blocco" data-per="taglia gif webp">
                <h3 class="blocco-titolo" data-t="clip.selezione"></h3>
                <dl class="scheda-dati">
                  <div><dt data-t="clip.inizio"></dt><dd id="c-sel-da">—</dd></div>
                  <div><dt data-t="clip.fine"></dt><dd id="c-sel-a">—</dd></div>
                  <div><dt data-t="clip.duration"></dt><dd id="c-sel-durata">—</dd></div>
                </dl>
              </section>
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="clip.sorgente"></h3>
                <div id="c-sorgente"></div>
              </section>
            </div>
            <div class="ispettore-piede">
              <button id="c-avvia" class="bottone pieno">
                <svg class="icona" viewBox="0 0 24 24"><use href="#i-scarica"/></svg>
                <span id="c-avvia-testo"></span>
              </button>
            </div>
          </aside>
        </div>

        <!-- ══ SOTTOTITOLI ══════════════════════════════════════════════ -->
        <!-- A sinistra il video, coi sottotitoli disegnati dalla pagina e non
             dal lettore: cosi' una correzione si vede mentre la si scrive. Al
             centro i segmenti, uno per riquadro: tempi, voce, testo. A destra
             cosa farne: Aggiorna salva, rifa' la traduzione e le tracce nel
             file; Esporta ne scrive una copia in SRT o WebVTT. -->
        <div class="sezione" data-sez="sub">
          <div class="lavoro">
            <header class="intestazione">
              <div class="simbolo"><svg class="icona" viewBox="0 0 24 24"><use href="#i-sottotitoli"/></svg></div>
              <div>
                <div class="occhiello" data-t="studio.occhiello"></div>
                <h1 data-t="menu.sub"></h1>
              </div>
              <span class="intestazione-coda" id="s-nome"></span>
            </header>
            <p class="intro" data-t="sub.desc"></p>

            <section class="importa">
              <label class="etichetta" data-t="sub.file"></label>
              <div class="campo-icona">
                <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-video"/></svg>
                <input id="s-file" class="campo con-icona scelto" type="text" readonly>
              </div>
            </section>

            <div class="avanzamento">
              <div class="binario"><div class="cursa"></div></div>
              <div class="avanzamento-testo"></div>
            </div>

            <div class="s-doppia">
              <section class="s-colonna">
                <div class="s-schermo" id="s-schermo"></div>
                <div class="s-piede">
                  <svg class="icona" viewBox="0 0 24 24"><use href="#i-sottotitoli"/></svg>
                  <span id="s-conteggio"></span>
                  <span class="s-nota" id="s-nota"></span>
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="s-mostra" checked><span class="cursore"></span>
                    <span data-t="sub.mostra"></span>
                  </label>
                </div>
              </section>
              <section class="s-colonna s-editor">
                <div class="s-editor-capo">
                  <h2><span data-t="sub.segmenti"></span><span class="conta" id="s-quanti">0</span></h2>
                  <button id="s-nuovo" class="bottone-icona">+</button>
                </div>
                <div class="s-voci" id="s-voci"></div>
                <div class="s-elenco" id="s-elenco"></div>
              </section>
            </div>
          </div>

          <aside class="ispettore">
            <div class="ispettore-testa">
              <svg class="icona" viewBox="0 0 24 24"><use href="#i-sottotitoli"/></svg>
              <h2 data-t="sub.opzioni"></h2>
            </div>
            <div class="ispettore-corpo">
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="sub.blocco.lingua"></h3>
                <div class="gruppo">
                  <label data-t="sub.lingua"></label>
                  <select id="s-lingua" class="campo">
                    <option value="" data-t="sub.lingua.originale"></option>
                  </select>
                </div>
                <div class="gruppo">
                  <label data-t="sub.formato"></label>
                  <select id="s-formato" class="campo">
                    <option value="srt">SRT</option>
                    <option value="vtt">VTT</option>
                  </select>
                </div>
              </section>
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="sub.blocco.aspetto"></h3>
                <div class="interruttori">
                  <label class="interruttore rovescio">
                    <input type="checkbox" id="s-impressa" checked><span class="cursore"></span>
                    <span data-t="sub.impressa"></span>
                  </label>
                </div>
                <div class="nota-riga" data-t="sub.impressa.nota"></div>
              </section>
              <section class="blocco">
                <h3 class="blocco-titolo" data-t="sub.sorgente"></h3>
                <div id="s-sorgente"></div>
              </section>
            </div>
            <div class="ispettore-piede">
              <button id="s-aggiorna" class="bottone contorno">
                <svg class="icona" viewBox="0 0 24 24"><use href="#i-avvia"/></svg>
                <span data-t="sub.update"></span>
              </button>
              <button id="s-esporta" class="bottone pieno">
                <svg class="icona" viewBox="0 0 24 24"><use href="#i-scarica"/></svg>
                <span data-t="sub.esporta"></span>
              </button>
              <p class="piede-nota" data-t="sub.esporta.nota"></p>
            </div>
          </aside>
        </div>

        <!-- ══ DOPPIAGGIO ═══════════════════════════════════════════════ -->
        <!-- Le battute di un video sottotitolato, e accanto a ciascuna il
             testo nuovo. Doppia fa dire il testo nuovo a chi parla, con la sua
             voce, in una copia a parte. -->
        <div class="sezione sola" data-sez="dop">
          <div class="lavoro">
            <header class="intestazione">
              <div class="simbolo"><svg class="icona" viewBox="0 0 24 24"><use href="#i-voce"/></svg></div>
              <div>
                <div class="occhiello" data-t="studio.occhiello"></div>
                <h1 data-t="menu.dop"></h1>
              </div>
            </header>
            <p class="intro" data-t="dop.desc"></p>

            <section class="importa">
              <label class="etichetta" data-t="sub.file"></label>
              <div class="modulo-link">
                <div class="campo-icona">
                  <svg class="icona-campo" viewBox="0 0 24 24"><use href="#i-video"/></svg>
                  <input id="d-file" class="campo con-icona scelto" type="text" readonly>
                </div>
                <button id="d-avvia" class="bottone pieno">
                  <svg class="icona" viewBox="0 0 24 24"><use href="#i-voce"/></svg>
                  <span data-t="dop.start"></span>
                </button>
              </div>
              <span class="s-nota" id="d-stima"></span>
            </section>

            <div class="avanzamento">
              <div class="binario"><div class="cursa"></div></div>
              <div class="avanzamento-testo"></div>
            </div>

            <div class="s-doppia">
              <section class="pannello">
                <div class="titolo-pannello">
                  <span class="spia"></span>
                  <span id="d-nome"></span>
                  <span class="stato"></span>
                  <div class="spazio"></div>
                  <button class="bottone nudo" id="d-vedi-originale" data-t="dop.originale" hidden></button>
                  <button class="bottone nudo" id="d-vedi-doppiato" data-t="dop.doppiato" hidden></button>
                </div>
                <div class="s-schermo" id="d-schermo"></div>
              </section>
              <section class="pannello">
                <div class="titolo-pannello"><span data-t="dop.list"></span></div>
                <div class="s-elenco" id="d-elenco"></div>
              </section>
            </div>
          </div>
        </div>

      </main>
    </div>

    <footer class="barra-stato">
      <span class="punto-stato" id="stato-punto"></span>
      <span id="stato-testo"></span>
      <!-- Quanto manca al lavoro in corso, in qualunque stanza stia girando. -->
      <div class="stato-avanzo" id="stato-avanzo" hidden>
        <div><span id="stato-cursa"></span></div>
        <span id="stato-percento"></span>
      </div>
      <!-- Si vede solo al primo avvio, mentre FFmpeg si scarica, o se non si
           e' riusciti a scaricarlo. -->
      <div class="spia-tor" id="spia-ffmpeg" data-fase="avvio" style="display: none">
        <span class="spia-tor-punto"></span><span class="spia-tor-testo"></span>
      </div>
      <span class="barra-stato-coda" data-t="stato.privato"></span>
    </footer>
  </div>

  <!-- Quello che va bene lo dice un avviso qui sotto, e quello che va male lo
       dice la finestra: con scritto su quale file, di che si tratta, e il
       testo tecnico sotto. Il diario completo continua a scriversi in logs/,
       dove serve davvero: a chi va a cercarlo dopo. -->
  <div class="avvisi" id="avvisi"></div>

  <div class="velo-trascina" id="velo-trascina">
    <div class="riquadro-trascina">
      <svg class="icona" viewBox="0 0 24 24"><use href="#i-scarica"/></svg>
      <span data-t="trascina"></span>
    </div>
  </div>

  <!-- La finestra modale e' una sola e viene riempita di volta in volta:
       un errore, un riepilogo, una conferma. Averne una per caso
       significherebbe quattro strutture da tenere allineate. -->
  <div class="velo-finestra" id="velo-finestra">
