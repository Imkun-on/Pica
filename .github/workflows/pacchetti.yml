# Costruisce Pica-Setup.exe e, sui tag, lo pubblica come Release.
#
#   git tag v1.2.0 && git push --tags     -> costruisce e pubblica
#   «Run workflow» da GitHub               -> costruisce e basta, per provare
#
# La cosa che conta: questo file NON rifa' a modo suo quello che fa
# costruisci.ps1. Lo chiama. Sono lo stesso comando che si lancia in locale, e
# quindi non possono divergere - che e' il modo in cui le pipeline di solito
# smettono di somigliare a quello che succede sulla macchina di chi sviluppa.

name: Pacchetti

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versione:
        description: 'Numero di versione da costruire'
        required: false
        default: '0.0.0-prova'

concurrency:
  group: pacchetti-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Decidi il numero di versione
        id: versione
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
              $v = '${{ github.event.inputs.versione }}'
              if (-not $v) { $v = '0.0.0-prova' }
          }
          Write-Host "Versione: $v"
          "valore=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          # Fissata, non "latest": pywin32 e pythonnet hanno le ruote
          # precompilate per questa, e su una versione appena uscita
          # finirebbero a compilarsi da sorgente o a non installarsi affatto.
          python-version: '3.12'
          cache: 'pip'

      - name: Procura ffmpeg
        shell: pwsh
        run: |
          # Non da Chocolatey, di proposito: choco mette nel PATH uno shim, e
          # un domani in cui questo pacchetto incorporasse FFmpeg finirebbe
          # dentro lo shim invece dell'eseguibile vero. Qui serve solo a far
          # passare il controllo di costruisci.ps1, ma la ragione resta.
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter 'ffmpeg.exe' | Select-Object -First 1).DirectoryName
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "ffmpeg in $bin"

      - name: Procura Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          # Si controlla che il file ci sia invece di lanciarlo con /?: quello
          # esce con codice diverso da zero e farebbe fallire il passo.
          if (-not (Test-Path $iscc)) { throw "ISCC.exe non trovato dopo l'installazione." }
          Write-Host "Inno Setup in $iscc"

      - name: Dipendenze Python
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Costruisci
        shell: pwsh
        run: .\costruisci.ps1 -Versione '${{ steps.versione.outputs.valore }}' -Forza

      - name: Versione portabile e impronte
        shell: pwsh
        run: |
          # Lo zip della stessa cartella che l'installatore copia, senza
          # installatore: si scompatta e si lancia. Esiste perche' un .exe
          # non firmato il browser lo ferma gia' al download («non viene
          # scaricato di frequente»), mentre uno zip di norma passa.
          $uscita = 'installer/output'
          Compress-Archive -Path 'dist/Pica' -DestinationPath "$uscita/Pica-Windows-portable.zip" -CompressionLevel Optimal

          # Le impronte di tutto cio' che si pubblica, in un file solo e nel
          # formato che `sha256sum -c` sa rileggere.
          Get-ChildItem $uscita -File | Where-Object Name -ne 'SHA256SUMS.txt' | ForEach-Object {
              '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content -Path "$uscita/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$uscita/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Pica-${{ steps.versione.outputs.valore }}
          path: |
            installer/output/Pica-Setup.exe
            installer/output/Pica-Windows-portable.zip
            installer/output/SHA256SUMS.txt
          retention-days: 30
          # E' gia' compresso con lzma2: ricomprimerlo non toglie un byte e
          # aggiunge un minuto.
          compression-level: 0

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.versione.outputs.valore }}'
          $file = 'installer/output/Pica-Setup.exe'
          $tutti = @($file, 'installer/output/Pica-Windows-portable.zip',
                     'installer/output/SHA256SUMS.txt')
          $mb = [math]::Round((Get-Item $file).Length / 1MB, 1)
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash

          # Le note si scrivono riga per riga in un array invece che con un
          # here-string di PowerShell: dentro un blocco YAML il terminatore
          # '@ dovrebbe stare in colonna zero, e l'indentazione del file lo
          # rende impossibile.
          $righe = @(
            "## Pica $v",
            "",
            "Scarica **Pica-Setup.exe** qui sotto e fai doppio clic.",
            "Non serve Python, non servono permessi di amministratore.",
            "",
            "Se il browser ferma il download dell'installatore, c'e' anche",
            "**Pica-Windows-portable.zip**: si scompatta dove si vuole e si",
            "lancia ``Pica.exe``, senza installare niente.",
            "",
            "| | |",
            "|---|---|",
            "| Peso | $mb MB |",
            "| SHA256 | ``$sha`` |",
            "",
            "### Se Windows dice che non conosce l'editore",
            "",
            "SmartScreen lo dice di ogni programma non firmato: una firma",
            "costa qualche centinaio di euro l'anno. Premi **Ulteriori",
            "informazioni**, poi **Esegui comunque**.",
            "",
            "Se preferisci controllare prima, l'impronta qui sopra si verifica",
            "cosi':",
            "",
            '```powershell',
            'Get-FileHash .\Pica-Setup.exe -Algorithm SHA256',
            '```'
          )
          $righe | Set-Content -Path note.md -Encoding utf8

          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload "v$v" @tutti --clobber
          } else {
              gh release create "v$v" @tutti --title "Pica $v" --notes-file note.md
          }
